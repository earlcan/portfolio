name: Sync Medium posts

on:
  schedule:
    - cron: "0 5 * * *"   # every day, 09:00 Dubai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_medium.py
      - name: Commit if changed
        run: |
          if git diff --quiet posts.json; then
            echo "No new posts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "Update Medium posts"
          git push
